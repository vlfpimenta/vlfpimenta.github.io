<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VLFP Info | Links Oficiais</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@0.400.0/dist/umd/lucide.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.5);
            --card-border: rgba(255, 255, 255, 0.1);
            --accent-primary: #3b82f6;
            --accent-secondary: #8b5cf6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* Efeito de Fundo Líquido Dinâmico */
        .background-blobs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 20s infinite alternate;
        }

        .blob-1 {
            width: 400px;
            height: 400px;
            background: var(--accent-primary);
            top: -100px;
            right: -100px;
        }

        .blob-2 {
            width: 500px;
            height: 500px;
            background: var(--accent-secondary);
            bottom: -150px;
            left: -150px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(100px, 50px) scale(1.1); }
        }

        /* Vidro (Glassmorphism) */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(30, 41, 59, 0.7);
            transform: translateY(-2px);
        }

        /* Logo dinâmico */
        .logo-box {
            width: 100%;
            max-width: 120px;
            margin: 0 auto;
        }

        .logo-box img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        /* Utilitários de ícones */
        .brand-icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .icon-wrapper {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.05);
        }

        /* Correção de centralização total */
        .main-container {
            width: 100%;
            max-width: 420px;
            padding: 2rem 1.5rem;
            margin: auto;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="main-container">
        <!-- Cabeçalho -->
        <header class="mb-10 space-y-4">
            <div class="logo-box mb-6">
                <img src="devlogo.png" alt="VLFP Info Logo" onerror="this.src='https://via.placeholder.com/150/3b82f6/ffffff?text=WP'">
            </div>
            <h1 class="text-3xl font-bold tracking-tight">VLFP Info</h1>
            <p class="text-gray-400 text-sm font-light">Soluções inteligentes para o seu negócio</p>
        </header>

        <!-- Lista de Links -->
        <div class="space-y-4">
            <!-- WhatsApp -->
            <a href="https://wa.me/5521987330744" target="_blank" class="glass-card flex items-center p-4 group">
                <div class="icon-wrapper mr-4">
                    <svg class="brand-icon text-green-500" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
                    </svg>
                </div>
                <div class="flex-1 text-left">
                    <h3 class="font-medium text-sm">WhatsApp</h3>
                    <p class="text-xs text-gray-400">Fale connosco agora</p>
                </div>
                <i data-lucide="chevron-right" class="w-4 h-4 text-gray-500"></i>
            </a>

            <!-- Instagram -->
            <a href="https://instagram.com/vlfp.info" target="_blank" class="glass-card flex items-center p-4 group">
                <div class="icon-wrapper mr-4">
                    <i data-lucide="instagram" class="w-6 h-6 text-pink-500"></i>
                </div>
                <div class="flex-1 text-left">
                    <h3 class="font-medium text-sm">Instagram</h3>
                    <p class="text-xs text-gray-400">@vlfp.info</p>
                </div>
                <i data-lucide="chevron-right" class="w-4 h-4 text-gray-500"></i>
            </a>

            <!-- TikTok -->
            <a href="https://tiktok.com/@vlfp.info" target="_blank" class="glass-card flex items-center p-4 group">
                <div class="icon-wrapper mr-4">
                    <svg class="brand-icon text-white" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12.525.02c1.31-.036 2.612-.012 3.914-.012.63 1.585 1.778 2.903 3.303 3.61 1.226.564 2.558.846 3.9.846v4.026a8.09 8.09 0 01-4.703-1.616c-.28-.212-.539-.447-.775-.705v6.505c0 1.341-.302 2.663-.883 3.868a8.217 8.217 0 01-2.4 3.09 8.358 8.358 0 01-8.156 1.205 8.318 8.318 0 01-4.992-5.58 8.24 8.24 0 011.666-7.53 8.318 8.318 0 015.688-3.088c.328-.028.656-.044.985-.044v4.03c-2.336.012-4.225 1.914-4.212 4.25a4.23 4.23 0 004.225 4.213c2.324-.012 4.201-1.9 4.212-4.225V.02Z"/>
                    </svg>
                </div>
                <div class="flex-1 text-left">
                    <h3 class="font-medium text-sm">TikTok</h3>
                    <p class="text-xs text-gray-400">@vlfp.info</p>
                </div>
                <i data-lucide="chevron-right" class="w-4 h-4 text-gray-500"></i>
            </a>

            <!-- E-mail -->
            <a href="mailto:vlfpinfo@gmail.com" class="glass-card flex items-center p-4 group">
                <div class="icon-wrapper mr-4">
                    <i data-lucide="mail" class="w-6 h-6 text-blue-400"></i>
                </div>
                <div class="flex-1 text-left">
                    <h3 class="font-medium text-sm">E-mail</h3>
                    <p class="text-xs text-gray-400">vlfpinfo@gmail.com</p>
                </div>
                <i data-lucide="chevron-right" class="w-4 h-4 text-gray-500"></i>
            </a>
        </div>

        <footer class="mt-12 h-10">
            <!-- Rodapé vazio conforme pedido -->
        </footer>
    </main>

    <script>
        // Inicialização de ícones e comportamentos
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) {
                lucide.createIcons();
            }

            // Garante que o container esteja sempre centralizado mesmo com resize
            const adjustCentering = () => {
                const body = document.body;
                if (window.innerHeight > document.body.scrollHeight) {
                    body.style.alignItems = 'center';
                } else {
                    body.style.alignItems = 'flex-start';
                }
            };

            window.addEventListener('resize', adjustCentering);
            adjustCentering();
        });
    </script>
</body>
</html>
