<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VLFP Info | Links Oficiais</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@0.400.0/dist/umd/lucide.js"></script>
    <style>
        /* Variáveis de cores baseadas no Moodboard */
        :root {
            /* Modo Claro (Default) */
            --bg-color: #F8FAFC;
            --card-bg: rgba(255, 255, 255, 0.7);
            --card-border: rgba(42, 48, 96, 0.1);
            --text-primary: #0D1128;
            --text-secondary: #475569;
            --blob-1: #1EC8A0; /* Teal Claro */
            --blob-2: #1B3A6B; /* Azul Navy */
            --icon-bg: rgba(0, 0, 0, 0.05);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                /* Modo Escuro */
                --bg-color: #0D1128; /* Dark Navy */
                --card-bg: rgba(20, 24, 48, 0.6); /* Navy Mid com transparência */
                --card-border: rgba(42, 48, 96, 0.5); /* Azul Outline */
                --text-primary: #FFFFFF;
                --text-secondary: #94a3b8;
                --blob-1: #1A8A82; /* Teal Médio */
                --blob-2: #2A1E3A; /* Roxo Médio */
                --icon-bg: rgba(255, 255, 255, 0.05);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* Efeito de Fundo Líquido Dinâmico */
        .background-blobs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: float 25s infinite alternate ease-in-out;
        }

        .blob-1 {
            width: 450px;
            height: 450px;
            background: var(--blob-1);
            top: -150px;
            right: -100px;
        }

        .blob-2 {
            width: 550px;
            height: 550px;
            background: var(--blob-2);
            bottom: -200px;
            left: -150px;
            animation-delay: -7s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            100% { transform: translate(120px, 80px) scale(1.2) rotate(15deg); }
        }

        /* Vidro (Glassmorphism) */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            border-color: var(--blob-1);
            background: var(--card-bg);
            transform: translateY(-4px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
        }

        /* Logo dinâmico */
        .logo-box {
            width: 100%;
            max-width: 140px;
            margin: 0 auto;
            transition: transform 0.3s ease;
        }
        
        .logo-box:hover {
            transform: scale(1.05);
        }

        .logo-box img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        /* Utilitários de ícones */
        .brand-icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .icon-wrapper {
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            background: var(--icon-bg);
            transition: transform 0.3s ease;
        }

        .glass-card:hover .icon-wrapper {
            transform: scale(1.1);
        }

        /* Container Principal */
        .main-container {
            width: 100%;
            max-width: 440px;
            padding: 3rem 1.5rem;
            margin: auto;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .text-secondary-themed {
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="main-container">
        <!-- Cabeçalho -->
        <header class="mb-12 space-y-4">
            <div class="logo-box mb-6">
                <img src="devlogo.png" alt="VLFP Info Logo" onerror="this.src='https://via.placeholder.com/150/1EC8A0/ffffff?text=VLFP'">
            </div>
            <h1 class="text-3xl font-bold tracking-tight">VLFP Info</h1>
            <p class="text-secondary-themed text-sm font-medium opacity-80">Soluções inteligentes para o seu negócio</p>
        </header>

        <!-- Lista de Links -->
        <div class="space-y-4">
            <!-- WhatsApp -->
            <a href="https://wa.me/5521987330744" target="_blank" class="glass-card flex items-center p-4 group">
                <div class="icon-wrapper mr-4">
                    <svg class="brand-icon text-green-500" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
                    </svg>
                </div>
                <div class="flex-1 text-left">
                    <h3 class="font-semibold text-base">WhatsApp</h3>
                    <p class="text-xs text-secondary-themed">Fale connosco agora</p>
                </div>
                <i data-lucide="chevron-right" class="w-5 h-5 text-secondary-themed opacity-50"></i>
            </a>

            <!-- Instagram -->
            <a href="https://instagram.com/vlfp.info" target="_blank" class="glass-card flex items-center p-4 group">
                <div class="icon-wrapper mr-4">
                    <i data-lucide="instagram" class="w-6 h-6 text-pink-500"></i>
                </div>
                <div class="flex-1 text-left">
                    <h3 class="font-semibold text-base">Instagram</h3>
                    <p class="text-xs text-secondary-themed">@vlfp.info</p>
                </div>
                <i data-lucide="chevron-right" class="w-5 h-5 text-secondary-themed opacity-50"></i>
            </a>

            <!-- TikTok -->
            <a href="https://tiktok.com/@vlfp.info" target="_blank" class="glass-card flex items-center p-4 group">
                <div class="icon-wrapper mr-4">
                    <svg class="brand-icon text-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12.525.02c1.31-.036 2.612-.012 3.914-.012.63 1.585 1.778 2.903 3.303 3.61 1.226.564 2.558.846 3.9.846v4.026a8.09 8.09 0 01-4.703-1.616c-.28-.212-.539-.447-.775-.705v6.505c0 1.341-.302 2.663-.883 3.868a8.217 8.217 0 01-2.4 3.09 8.358 8.358 0 01-8.156 1.205 8.318 8.318 0 01-4.992-5.58 8.24 8.24 0 011.666-7.53 8.318 8.318 0 015.688-3.088c.328-.028.656-.044.985-.044v4.03c-2.336.012-4.225 1.914-4.212 4.25a4.23 4.23 0 004.225 4.213c2.324-.012 4.201-1.9 4.212-4.225V.02Z"/>
                    </svg>
                </div>
                <div class="flex-1 text-left">
                    <h3 class="font-semibold text-base">TikTok</h3>
                    <p class="text-xs text-secondary-themed">@vlfp.info</p>
                </div>
                <i data-lucide="chevron-right" class="w-5 h-5 text-secondary-themed opacity-50"></i>
            </a>

            <!-- E-mail -->
            <a href="mailto:vlfpinfo@gmail.com" class="glass-card flex items-center p-4 group">
                <div class="icon-wrapper mr-4">
                    <i data-lucide="mail" class="w-6 h-6 text-blue-500"></i>
                </div>
                <div class="flex-1 text-left">
                    <h3 class="font-semibold text-base">E-mail</h3>
                    <p class="text-xs text-secondary-themed">vlfpinfo@gmail.com</p>
                </div>
                <i data-lucide="chevron-right" class="w-5 h-5 text-secondary-themed opacity-50"></i>
            </a>
        </div>

        <!-- Espaçamento inferior -->
        <footer class="mt-16">
        </footer>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Inicializa ícones Lucide
            if (window.lucide) {
                lucide.createIcons();
            }

            // Garante centralização vertical dinâmica
            const checkHeight = () => {
                if (document.body.scrollHeight > window.innerHeight) {
                    document.body.style.alignItems = 'flex-start';
                } else {
                    document.body.style.alignItems = 'center';
                }
            };
            
            window.addEventListener('resize', checkHeight);
            checkHeight();
        });
    </script>
</body>
</html>
