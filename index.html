        :root {

            --glass-border: rgba(255, 255, 255, 0.2);
            --text-color: #1a1a1a;
            --blob-color-1: #6366f1;
            --blob-color-2: #a855f7;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --glass-bg: rgba(15, 15, 15, 0.3);
                --glass-border: rgba(255, 255, 255, 0.1);
                --text-color: #ffffff;
                --blob-color-1: #312e81;
                --blob-color-2: #581c87;
            }
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: var(--text-color);
            overflow-x: hidden;
            transition: background-color 0.5s ease;
        }

        .dark body {
            background-color: #0f172a;
        }

        /* Efeito Liquid Background */
        .blob-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            filter: blur(80px);
            overflow: hidden;
        }

        .blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, var(--blob-color-1), var(--blob-color-2));
            border-radius: 50%;
            opacity: 0.6;
            animation: move 20s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(-10%, -10%) scale(1); }
            to { transform: translate(20%, 20%) scale(1.2); }
        }

        .blob-2 {
            top: 40%;
            right: -10%;
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #10b981, #3b82f6);
            animation-duration: 25s;
            animation-delay: -5s;
        }

        /* Glassmorphism Card */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
        }

        .link-button {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
        }

        .link-button:hover {
            transform: translateY(-3px) scale(1.02);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        /* Estilo para imagem do logo */
        .logo-container img {
            max-width: 180px;
            height: auto;
            transition: transform 0.3s ease;
        }
        
        .logo-container img:hover {
            transform: scale(1.05);
        }

        .image-fallback {
            background: linear-gradient(45deg, #6366f1, #a855f7);
            color: white;
            padding: 20px;
            border-radius: 12px;
            font-weight: bold;
            display: none;
        }

        /* Ajuste de ícones SVG personalizados */
        .brand-icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
    </style>
</head>

    <script>
        // Inicializa os ícones do Lucide
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        });

        // Gerenciamento de Tema (Dark/Light)
        const updateTheme = () => {
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        };

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateTheme);
        updateTheme();

        // Efeito de paralaxe nos blobs
        if (window.innerWidth > 768) {
            document.addEventListener('mousemove', (e) => {
                const blobs = document.querySelectorAll('.blob');
                const x = (e.clientX / window.innerWidth) - 0.5;
                const y = (e.clientY / window.innerHeight) - 0.5;
                
                if (blobs[0]) blobs[0].style.transform = `translate(${x * 50}px, ${y * 50}px)`;
                if (blobs[1]) blobs[1].style.transform = `translate(${x * -60}px, ${y * -60}px)`;
            });
        }
    </script>
